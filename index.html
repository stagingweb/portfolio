<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A Wordpress developer portfolio focused on thoughtful digital experiences."
    />
    <meta name="theme-color" content="#000000" />
    <title>Wordpress Developer — Portfolio</title>
    <script>
      (() => {
        const navigation =
          window.performance?.getEntriesByType?.("navigation")?.[0];
        if (navigation?.type === "back_forward") {
          window.__skipHomePreloader = true;
          return;
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
          return;
        document.documentElement.classList.add("motion-pending");
        window.__homeLoaderFallback = window.setTimeout(() => {
          const loader = document.querySelector(".site-loader");
          loader?.remove();
          document.documentElement.classList.remove("motion-pending");
        }, 8000);
      })();
    </script>
    <link
      rel="icon"
      href="./assets/images/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <link rel="stylesheet" href="./assets/libs/swiper-bundle.min.css" />
  </head>

  <body>
    <div class="site-loader" aria-hidden="true">
      <span class="site-loader__glow"></span>
      <svg class="site-loader__ring" viewBox="0 0 100 100" focusable="false">
        <circle
          class="site-loader__progress"
          cx="50"
          cy="50"
          r="49.5"
          stroke-dasharray="9999 9999"
          stroke-dashoffset="9999"
          data-loader-progress
        />
      </svg>
    </div>

    <div class="scene" aria-hidden="true"></div>

    <header id="header" class="site-header" aria-label="Site header"></header>

    <main id="top" class="page-home">
      <section class="hero" aria-labelledby="hero-title">
        <button
          class="hero-globe-control"
          type="button"
          aria-label="Rotate globe: drag with a pointer or use the arrow keys"
          hidden
        ></button>
        <h1 id="hero-title" class="hero-title" data-hero-motion="title">
          <span class="hero-title__line hero-title__line--script">
            <span class="visually-hidden">Wordpress</span>
            <svg
              class="hero-title__script-svg"
              viewBox="0 0 520 150"
              fill="none"
              aria-hidden="true"
              focusable="false"
            >
              <g
                class="hero-title__ink"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M24 41 C39 32 50 35 47 52 C43 71 30 106 38 109 C45 112 64 78 77 53 C72 76 67 103 79 108 C93 112 116 67 130 37"
                />
                <path
                  d="M146 77 C134 73 124 84 126 95 C128 107 142 108 151 98 C162 86 156 75 146 77 C140 78 138 83 138 88 C140 95 155 95 166 87"
                />
                <path
                  d="M164 99 C172 94 179 75 183 75 C187 75 177 94 177 99 C184 89 192 76 202 77 C208 77 209 80 211 82"
                />
                <path
                  d="M215 84 C206 78 197 87 200 97 C203 106 215 103 223 95 C230 87 242 50 248 36 C256 17 264 26 255 51 C248 72 236 95 244 100 C251 105 262 94 268 90"
                />
                <path
                  d="M269 107 C281 91 289 57 295 37 C301 17 313 23 310 38 C304 65 290 96 286 105 M297 44 C312 32 340 29 348 41 C357 55 338 70 311 68 C305 68 302 67 298 64"
                />
                <path
                  d="M341 97 C351 90 358 74 362 74 C367 74 357 91 356 99 C365 83 375 74 385 78"
                />
                <path
                  d="M386 94 C403 91 416 79 410 74 C404 69 389 78 387 91 C385 102 400 108 418 96"
                />
                <path
                  d="M422 95 C422 101 428 105 436 104 C446 103 451 99 445 94 C440 89 428 89 431 82 C434 75 446 74 452 80"
                />
                <path
                  d="M461 96 C461 102 468 107 476 106 C487 105 493 100 488 95 C483 89 470 89 473 82 C476 75 490 74 497 81"
                />
              </g>
            </svg>
          </span>
          <span class="hero-title__line hero-title__line--display"
            >Developer.</span
          >
        </h1>

        <div class="hero-intro" data-hero-motion="intro">
          <p>
            Hi! I’m a Wordpress developer, building clear, considered
            experiences for the web.
          </p>
          <p>
            I blend creativity with technology to turn designs into captivating
            digital experiences that feel alive, engaging, and a little
            unexpected.
          </p>
          <a class="hero-cta site-cta" href="mailto:huubang0312@gmail.com">
            <span>Get in touch</span>
            <span class="site-cta__arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>

    <section
      id="projects"
      class="work-showcase"
      aria-label="Selected work"
    ></section>

    <section
      id="services"
      class="services-section"
      aria-labelledby="services-title"
    ></section>

    <footer
      id="footer"
      class="site-footer"
      aria-label="Site information"
    ></footer>

    <script>
      window.siteComponentsReady = Promise.all([
        fetch("./components/header.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site header.");
          return response.text();
        }),
        fetch("./components/footer.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site footer.");
          return response.text();
        }),
        fetch("./components/projects.html").then((response) => {
          if (!response.ok)
            throw new Error("Unable to load the work showcase.");
          return response.text();
        }),
        fetch("./components/services.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load services.");
          return response.text();
        })
      ])
        .then(([header, footer, projects, services]) => {
          document.getElementById("header").innerHTML = header;
          document.getElementById("footer").innerHTML = footer;
          document.getElementById("projects").innerHTML = projects;
          document.getElementById("services").innerHTML = services;
        })
        .catch((error) => {
          console.error(error);
          return null;
        });
    </script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script type="module" src="./assets/main/js/script.min.js"></script>
  </body>
</html>
