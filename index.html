<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A creative developer portfolio focused on thoughtful digital experiences."
    />
    <meta name="theme-color" content="#000000" />
    <title>Creative Developer — Portfolio</title>
    <script>
      (() => {
        const navigation = window.performance?.getEntriesByType?.("navigation")?.[0];
        if (navigation?.type === "back_forward") {
          window.__skipHomePreloader = true;
          return;
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.documentElement.classList.add("motion-pending");
        window.__homeLoaderFallback = window.setTimeout(() => {
          const loader = document.querySelector(".site-loader");
          loader?.remove();
          const scene = document.querySelector(".scene");
          scene?.classList.remove("is-preloading");
          const sphere = scene?.querySelector(".scene-sphere");
          ["opacity", "visibility", "transform", "filter", "--sphere-fill-opacity", "--sphere-surface-opacity"]
            .forEach((property) => sphere?.style.removeProperty(property));
          document.documentElement.classList.remove("motion-pending");
        }, 2800);
      })();
    </script>
    <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bonheur+Royale&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <link rel="stylesheet" href="./assets/libs/swiper-bundle.min.css" />
  </head>

  <body>
    <div class="site-loader" aria-hidden="true">
      <svg class="site-loader__ring" viewBox="0 0 100 100" focusable="false">
        <circle class="site-loader__track" cx="50" cy="50" r="49.3" />
        <circle
          class="site-loader__progress"
          cx="50"
          cy="50"
          r="49.3"
          stroke-dasharray="309.76 309.76"
          stroke-dashoffset="309.76"
          data-loader-progress
        />
      </svg>
    </div>

    <div class="scene" aria-hidden="true">
      <div class="scene-floor" data-hero-motion="floor"></div>
      <div class="scene-sphere" data-hero-motion="sphere">
        <div class="scene-sphere__surface"></div>
      </div>
      <div class="scene-reflection" data-hero-motion="reflection">
        <div class="scene-reflection__sphere"></div>
      </div>
    </div>

    <header id="header" class="site-header" aria-label="Site header"></header>

    <main id="top" class="page-home">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="hero-title" data-hero-motion="title">
          <span class="hero-title__line hero-title__line--script">Creative</span>
          <span class="hero-title__line hero-title__line--display">Developer.</span>
        </h1>

        <div class="hero-intro" data-hero-motion="intro">
          <p>
            Hi! I’m a creative developer and web designer, building clear,
            considered experiences for the web.
          </p>
          <p>
            I bring design and technology together to make digital work with
            personality, purpose, and a little room for the unexpected.
          </p>
          <a class="hero-cta" href="mailto:hello@example.com">
            <span>Get in touch</span>
            <span class="hero-cta__arrow" aria-hidden="true">›</span>
          </a>
        </div>
      </section>
    </main>

    <section id="projects" class="work-showcase" aria-label="Selected work"></section>

    <footer id="footer" class="site-footer" aria-label="Site information"></footer>

    <script>
      window.siteComponentsReady = Promise.all([
        fetch("./components/header.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site header.");
          return response.text();
        }),
        fetch("./components/footer.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site footer.");
          return response.text();
        }),
        fetch("./components/projects.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the work showcase.");
          return response.text();
        }),
      ])
        .then(([header, footer, projects]) => {
          document.getElementById("header").innerHTML = header;
          document.getElementById("footer").innerHTML = footer;
          document.getElementById("projects").innerHTML = projects;
        })
        .catch((error) => {
          console.error(error);
          return null;
        });
    </script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script type="module" src="./assets/main/js/script.min.js"></script>
  </body>
</html>
