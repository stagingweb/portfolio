<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A creative developer portfolio focused on thoughtful digital experiences."
    />
    <meta name="theme-color" content="#000000" />
    <title>Creative Developer — Portfolio</title>
    <script>
      (() => {
        const navigation = window.performance?.getEntriesByType?.("navigation")?.[0];
        if (navigation?.type === "back_forward") {
          window.__skipHomePreloader = true;
          return;
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.documentElement.classList.add("motion-pending");
        window.__homeLoaderFallback = window.setTimeout(() => {
          const loader = document.querySelector(".site-loader");
          loader?.remove();
          document.documentElement.classList.remove("motion-pending");
        }, 8000);
      })();
    </script>
    <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <link rel="stylesheet" href="./assets/libs/swiper-bundle.min.css" />
  </head>

  <body>
    <div class="site-loader" aria-hidden="true">
      <span class="site-loader__glow"></span>
      <svg class="site-loader__ring" viewBox="0 0 100 100" focusable="false">
        <circle
          class="site-loader__progress"
          cx="50"
          cy="50"
          r="49.5"
          stroke-dasharray="9999 9999"
          stroke-dashoffset="9999"
          data-loader-progress
        />
      </svg>
    </div>

    <div class="scene" aria-hidden="true"></div>

    <header id="header" class="site-header" aria-label="Site header"></header>

    <main id="top" class="page-home">
      <section class="hero" aria-labelledby="hero-title">
        <button
          class="hero-globe-control"
          type="button"
          aria-label="Rotate globe: drag with a pointer or use the arrow keys"
          hidden
        ></button>
        <h1 id="hero-title" class="hero-title" data-hero-motion="title">
          <span class="hero-title__line hero-title__line--script">
            <span class="visually-hidden">Creative</span>
            <svg class="hero-title__script-svg" viewBox="0 0 455 150" fill="none" aria-hidden="true" focusable="false">
              <g class="hero-title__ink" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M130 37 C107 24 77 29 52 47 C27 65 17 94 32 108 C47 124 74 112 100 98 C113 91 120 85 128 80" />
                <path d="M99 99 C112 91 119 76 124 71 C130 65 126 84 121 96 C136 78 148 73 158 80" />
                <path d="M156 94 C176 91 190 79 184 74 C177 67 158 78 158 93 C158 107 174 107 193 95" />
                <path d="M193 95 C205 88 215 73 225 74 C233 74 232 85 225 94 C218 103 208 107 205 100 C201 91 215 77 230 76 C222 97 230 105 246 95" />
                <path d="M245 95 C258 89 266 65 275 41 C281 26 286 32 281 47 L269 88 C265 103 275 105 294 91" />
                <path d="M250 61 C268 57 290 56 310 57" stroke-width="1.5" />
                <path d="M294 91 C304 87 307 74 311 73 C314 72 309 84 305 92 C300 103 313 103 326 92" />
                <path d="M319 52 L322 46" stroke-width="2.5" />
                <path d="M326 92 C334 81 338 73 341 74 C343 78 334 96 342 100 C353 106 369 90 379 73" />
                <path d="M378 93 C399 89 410 78 404 74 C397 68 379 78 379 94 C379 108 399 106 419 93 C432 85 441 83 449 83" />
              </g>
            </svg>
          </span>
          <span class="hero-title__line hero-title__line--display">Developer.</span>
        </h1>

        <div class="hero-intro" data-hero-motion="intro">
          <p>
            Hi! I’m a creative developer and web designer, building clear,
            considered experiences for the web.
          </p>
          <p>
            I bring design and technology together to make digital work with
            personality, purpose, and a little room for the unexpected.
          </p>
          <a class="hero-cta" href="mailto:hello@example.com">
            <span>Get in touch</span>
            <span class="hero-cta__arrow" aria-hidden="true">›</span>
          </a>
        </div>
      </section>
    </main>

    <section id="projects" class="work-showcase" aria-label="Selected work"></section>

    <section id="services" class="services-section" aria-labelledby="services-title"></section>

    <footer id="footer" class="site-footer" aria-label="Site information"></footer>

    <script>
      window.siteComponentsReady = Promise.all([
        fetch("./components/header.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site header.");
          return response.text();
        }),
        fetch("./components/footer.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the site footer.");
          return response.text();
        }),
        fetch("./components/projects.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load the work showcase.");
          return response.text();
        }),
        fetch("./components/services.html").then((response) => {
          if (!response.ok) throw new Error("Unable to load services.");
          return response.text();
        }),
      ])
        .then(([header, footer, projects, services]) => {
          document.getElementById("header").innerHTML = header;
          document.getElementById("footer").innerHTML = footer;
          document.getElementById("projects").innerHTML = projects;
          document.getElementById("services").innerHTML = services;
        })
        .catch((error) => {
          console.error(error);
          return null;
        });
    </script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script type="module" src="./assets/main/js/script.min.js"></script>
  </body>
</html>
